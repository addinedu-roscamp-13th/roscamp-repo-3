# ============================================================================
# Raspberry Pi robot client -> Laptop-local YOLO + pick-plan service
# ============================================================================
# The Raspberry Pi captures the image and reads the current robot Flange pose.
# The laptop runs YOLO and 2D->3D pick planning, then returns flange_command.
#
# Before running:
#   1) Start the laptop server: python run_server.py
#   2) Find the laptop's LAN IPv4 address.
#   3) Confirm grasp_server_url below.
#
# Run on the Raspberry Pi:
#   cd /home/jetcobot/wasab/roscamp-repo-3/Device/WasabBot/WasabArmController
#   python3 check_server_connection.py
#   python3 run_client.py
# ============================================================================

# ============================================================================
# 1. Network / Remote Control / Camera Stream
# ============================================================================

[network]
; Use the laptop LAN IP, never 127.0.0.1. The laptop server listens on port 8000.
grasp_server_url = http://192.168.2.8:8000/v1/grasp-plan
; Health check is derived from grasp_server_url: http://192.168.2.8:8000/health.
; The paired laptop service returns this value from GET /health.
expected_server_runtime = laptop-local
; Keep false during deployment: loopback means "this Raspberry Pi", not the laptop.
allow_loopback_server = false
connect_timeout_sec = 3.0
health_timeout_sec = 5.0
check_server_on_startup = true
; CPU inference can be slower on the laptop. Increase only when an actual request needs longer.
request_timeout_sec = 45.0
; No delay is added when the first connection succeeds.
plan_connect_retry_count = 2
plan_connect_retry_interval_sec = 0.5
jpeg_quality = 90

[arm_identity]
; Use left on the calibrated JetCobot. The second JetCobot must use right.
arm_id = left
role = left
dual_arm_enabled = true
configured = true
setup_mode = false

[camera_stream]
; Upload the latest robot camera frame to the laptop server so it can be viewed at:
;   http://192.168.2.8:8000/camera-view
; This does not run YOLO. It only sends a lightweight preview image.
enabled = true
workspace_overlay_enabled = false
fps = 4.0
timeout_sec = 0.8
jpeg_quality = 45

[udp_stream]
; WaSaBArm Streamer -> WaSaBWebService camera preview transport.
; Leave host empty to reuse the host from [network] grasp_server_url.
enabled = true
host =
port = 8001
; Keep below common MTU to reduce packet fragmentation on Wi-Fi.
max_datagram_bytes = 1400
; If UDP send fails locally, fall back to HTTP /camera-frame upload.
fallback_http = true

[remote_control]
; Browser button commands are delivered by a persistent server-push stream. No polling is used.
enabled = true
timeout_sec = 0.4

[hand_gesture]
; Left Arm is dedicated to Pick & Place. Gesture recognition runs only on Right Arm.
enabled = false
; Keep the feature available, but require the AdminGUI Gesture button to turn it on.
start_enabled = false
stable_frames = 20
release_frames = 6
cooldown_sec = 8.0
process_fps = 8.0
hold_sec = 3.0
min_palm_span_norm = 0.07
max_palm_span_norm = 0.30
edge_margin_norm = 0.06
palm_reference_enabled = false
min_detection_confidence = 0.70
min_tracking_confidence = 0.70
auto_place = true
; High, vertical-down waiting pose so the camera sees the widest practical area.
home_enabled = true
home_flange_coords = 14.3, 141.4, 291.7, -176.64, 8.69, -27.79
home_speed = 20

; ============================================================================
; 2. Camera / Robot / Gripper / Safety
; ============================================================================

[camera]
camera_id = /dev/v4l/by-id/usb-Sonix_Technology_Co.__Ltd._USB_2.0_Camera-video-index0
; Must exactly match the laptop server calibration settings.
; The supplied laptop project uses 640 x 480.
frame_width = 640
frame_height = 480
; Discard buffered frames when pick is requested so the plan uses a recent image.
flush_frames_before_capture = 2

[robot]
mycobot_port = /dev/ttyJETCOBOT
mycobot_baud = 1000000
; send_coords speed and mode
move_speed = 35
move_mode = 0
; Target-reached tolerances
pose_position_tol_mm = 6.0
pose_angle_tol_deg = 3.0
move_timeout_sec = 20.0
move_poll_sec = 0.05
; Measured left-arm HOME. Joint angles are preferred to preserve the verified IK branch.
; Base-frame home Flange pose: x, y, z, rx, ry, rz
home_flange_coords = 9.9, 140.7, 314.4, -170.24, 20.97, -39.61
home_joint_angles = 112.93, -20.65, 20.39, -66.62, 0.7, 64.42

[gripper]
; Typical electric gripper: 0=closed, 100=open. Adjust only for the physical device.
open_value = 100
close_value = 0
speed = 70
settle_sec = 0.4

[safety]
; Keep true for the first end-to-end laptop-local test.
; With true, no robot or gripper command is sent after a plan is received.
dry_run = false
; Pi-side final workspace gate for server flange_command [mm].
safe_x_min_mm = -260.0
safe_x_max_mm = 260.0
safe_y_min_mm = -281.0
safe_y_max_mm = 281.0
safe_z_min_mm = -50.0
safe_z_max_mm = 350.0
; Absolute limit for rx, ry, rz [deg].
safe_euler_abs_deg = 180.0

; ============================================================================
; 3. Manual Motion
; ============================================================================

[manual_motion]
; M command: move to this configured Base-frame Flange pose after local safety validation.
enabled = true
target_flange_coords = 144.1, -62.3, 241.4, -177.85, 5.43, -137.08

; ============================================================================
; Left Recycle: trash -> red bin, water -> blue bin
; ============================================================================

[recycle]
enabled = true
; true: color center pixel -> Hand-Eye Base XY. false: measured joint pose rollback.
dynamic_color_target = true
; Water/blue skips dynamic XY and moves directly to its measured Flange pose.
blue_fixed_target = true
; Trash/red skips dynamic XY and moves directly to its measured joint pose.
red_fixed_target = true
bin_plane_z_base_mm = 90.0
; Reject a calculated target farther than this from the measured bin center.
dynamic_max_xy_offset_mm = 40.0
; Move here while holding the picked object, then observe the bins for 3 sec.
view_flange_coords = 14.0, 142.0, 318.8, -164.32, 21.22, -40.96
view_joint_angles = 113.29, -20.21, 20.3, -64.42, -5.27, 66.0
view_observe_sec = 3.0
; Operator-measured final bin-center poses (red, then blue).
red_flange_coords = -64.4, 214.3, 196.1, -169.52, 6.98, 47.90
red_joint_angles = 121.37, -21.97, -68.29, 8.43, 9.58, -15.2
blue_flange_coords = -94.5, 239.8, 193.8, -178.80, 5.06, -35.96
blue_joint_angles = 125.94, -70.4, 24.96, -39.37, 0.43, 71.98
motion_speed = 20
blue_motion_speed = 10
color_min_area_ratio = 0.01
color_saturation_min = 90
color_value_min = 50

; ============================================================================
; 4. Pick Motion / Pick Search / Pick Centering
; ============================================================================

[pick_motion]
; Extra Base-frame XY correction applied only when the server auto-rotates the
; gripper for a long object. Tune signs after one test pick if the offset is
; opposite on the real gripper.
auto_rotated_xy_correction_enabled = false
auto_rotated_min_rz_offset_deg = 45.0
auto_rotated_base_xy_offset_mm = 0.0, 15.0
; Left YOLO Pick only. Keep the planned flange target inside the MyCobot Y limit.
plan_base_xy_offset_mm = 0.0, -20.0
; Pick final motion: approach from above, then descend slowly to avoid hitting
; a tilted box from the side.
two_stage_approach_enabled = false
approach_lift_z_mm = 15.0
approach_speed = 25
final_approach_speed = 20
; 1 = Cartesian linear descent for the final short approach.
final_approach_mode = 1

[right_pick_reference]
enabled = false

[pick_search]
; Pick command fallback: if the first camera view cannot detect the target,
; keep the vertical-down home orientation and move 20 mm to either side.
enabled = false
; Retry YOLO on fresh frames without moving the robot.
stationary_retry_count = 5
stationary_retry_interval_sec = 0.15
; Optional arm-specific search starting pose. Left Arm keeps its current view.
move_to_start_enabled = false
start_flange_coords = 105.9, -56.7, 304.3, -174.77, 14.97, -132.18
use_flange_pose = false
; Search starts from this vertical-down home Flange pose.
max_flange_coords = 105.9, -56.7, 304.3, -174.77, 14.97, -132.18
; Base Y is the left/right direction for the current home/camera setup.
translation_axis =
translation_offsets_mm = -20, 20
; If both side views miss, return to home X/Y and raise the camera by 20 mm.
lift_offsets_mm = 20
; Legacy rotation/joint settings below are ignored while translation_axis is set.
angle_axis = rz
angle_offsets_deg = 0, -25, 25, -45, 45
; Legacy single-axis search values. Used only when grid_enabled = false.
joints = 1
offsets_deg = 0, -20, 20, -35, 35
; 3x3 search moves one view cell at a time with enough settle time for YOLO.
grid_enabled = true
grid_joints = 4, 5
grid_offsets_deg = -20, 0, 20
speed = 8
settle_sec = 0.70
frame_timeout_sec = 1.4
; If every alternate view fails, return to the starting joint pose.
return_to_start = true

[pick_centering]
; If pick is rejected because the object bbox touches the image edge, move the
; camera view toward the bbox center and retry before the wider pick_search.
enabled = false
max_attempts = 4
deadband_px = 50.0
; If centering moves the object farther from center, flip the sign of the gain.
j1_gain_deg_per_px = -0.04
j2_gain_deg_per_px = 0.025
j5_gain_deg_per_px = 0.04
max_step_deg = 8.0
speed = 12
settle_sec = 0.35

[gift_supply_search]
; Restock: inspect exactly one taught view. If no Coca-Cola is present, return
; HOME without searching. If present, use the second taught joint pose to pick.
enabled = true
search_view_flange_coords = -48.4, 209.6, 244.6, -179.64, 4.34, -45.75
search_view_joint_angles = 120.32, -49.74, 22.06, -58.0, 0.7, 76.11
pickup_flange_coords = -121.4, 262.0, 135.6, -176.55, 9.48, -46.42
pickup_joint_angles = 128.23, -91.4, 21.26, -10.1, -2.54, 84.72
restock_place_flange_coords = -16.6, 275.8, 139.6, 175.52, -1.88, -37.98
restock_place_joint_angles = 106.52, -75.49, 0.26, -18.89, 2.54, 54.49
motion_z_offset_mm = 0.0
j5_offsets_deg = 0
speed = 8
settle_sec = 3.0
frame_timeout_sec = 1.0
; Release the replacement can above the original pickup Z so it is not
; pressed into the table during the final Restock placement.
restock_place_y_offset_mm = 15.0
restock_place_z_offset_mm = 10.0

; ============================================================================
; 5. Place Motion / Place Marker View / Marker Search
; ============================================================================

[place_motion]
; F command: move HOME first, then move to this Base-frame Flange pose and open the gripper.
; Placeholder is currently HOME_FLANGE_COORDS. Adjust this later for the real drop-off position.
enabled = true
target_flange_coords = 105.9, -56.7, 304.3, -174.77, 14.97, -132.18
; AprilTag place final approach speed. Lower values place the object more gently.
approach_speed = 12
; If enabled, place final approach is split into waypoints and slows down
; toward the final drop pose. Number of speeds controls the number of steps.
approach_slowdown_enabled = true
approach_speeds = 10, 4
; Pause after reaching the place pose before opening the gripper.
release_pause_sec = 0.3
; Gripper release used only by place. Manual q/open still uses [gripper] speed.
gripper_open_speed = 15
gripper_settle_sec = 1.0

[place_marker_view]
; Place command: after HOME and before marker search, rotate flange RZ while
; holding the object so the gripper is less likely to block the AprilTag view.
; This extra rotation is used only when the last pick used auto gripper rotation.
rotate_before_search_enabled = true
rz_offset_deg = 25.0
speed = 15

[marker_search]
; Internal Place flow: scan the camera until the required April marker is visible.
enabled = true
; AprilTag 36h11 role assignment. ID 0 is the movable pickup box.
; The retired pickup-tray ID 6 is intentionally blocked.
dictionary = DICT_APRILTAG_36h11
target_ids = 0, 1, 3, 4, 7, 8, 9
pickup_ids = 0, 1, 4
place_ids = 3, 7, 8, 9
; Passive recognition for the AdminGUI live preview; this never moves the robot.
; Disabled: this OpenCV build can segfault in continuous cv2.aruco preview detection.
; Explicit marker/pick commands still run their requested detection path.
preview_detection_enabled = false
preview_detection_fps = 4.0
pan_joint = 1
pan_range_deg = 50.0
search_step_deg = 3.0
speed = 25
hz = 8.0
; 0 means keep scanning until a marker is found or the process is stopped.
max_duration_sec = 0.0
; While sweeping the pan joint, cycle these inner wrist joints through offset
; sets so the camera searches from wider marker-view angles.
view_joint_enabled = true
view_joints = 4, 5
; Semicolon-separated offset sets. Each row maps to view_joints in order.
view_joint_offsets_deg = 0, 0; 20, 20; -20, -20; 35, 15; -35, -15
view_joint_speed = 15

[marker_pickup]
; Left Arm Pick: locate the movable box carrying AprilTag ID 0.
enabled = true
arm_id = left
marker_id = 0
; Help uses AprilTag ID 0 as the pickup gate, then reuses the normal Left
; Pickup final reference pose.
target_flange_coords = -30.1, 274.2, 132.7, -177.12, -2.90, -52.48
use_joint_target = false
target_joint_angles = -22.93, -47.72, -20.21, -18.1, -0.35, 111.0
; Keep Cartesian bias disabled. A larger X command crosses the arm's IK boundary
; and leaves the robot at home; use measured joint angles for final tuning.
command_compensation_xyz_mm = 0.0, 0.0, 0.0
dynamic_marker_alignment = false
; White work-surface plane holding the ID 0 box.
marker_plane_z_base_mm = 0.0
target_z_offset_mm = 30.0
target_base_offset_mm = 0.0, 0.0, 0.0
grasp_x_clearance_mm = 0.0
; Stop 5mm above the measured tray pick Z, grip, then lift 20mm in Base Z.
grasp_z_clearance_mm = 0.0
fine_descent_z_mm = 0.0
post_pick_lift_z_mm = 20.0
post_pick_lift_speed = 8
tuning_clearance_z_mm = 15.0
approach_lift_z_mm = 15.0
approach_speed = 8
; The Cartesian staging pose may settle about 5-6mm off in X. The final
; pickup pose still uses the exact recorded joint angles below.
approach_position_tolerance_mm = 8.0
descent_speed = 5

[help]
; Used only by Help after AprilTag ID 0 is visible at HOME.
pick_flange_coords = -17.1, 256.1, 138.9, -176.00, 4.38, -44.39
pick_joint_angles = 108.72, -45.52, -61.78, 23.02, -1.58, 63.19
pick_speed = 5
place_flange_coords = 116.9, 226.4, 179.4, -166.58, 6.52, -47.54
place_joint_angles = 77.87, -37.7, -58.71, 21.09, -2.54, 35.85
place_speed = 10
; Search by joint angles: J1 negative first, then positive; retry at J5 offsets.
joint_search_enabled = true
pan_joint = 1
negative_range_deg = 30.0
positive_range_deg = 15.0
step_deg = 3.0
j5_offsets_deg = 0, -8, 8
joint_search_speed = 8
joint_search_settle_sec = 0.35
joint_search_frame_timeout_sec = 1.4
return_to_start_if_missing = true

[black_table]
; Place the ID 0 box at the center of a fully visible dark rectangular surface.
enabled = true
surface_z_base_mm = 0.0
max_value = 70
; Place only when the detected black surface fills at least 70% of the frame.
min_area_ratio = 0.70
max_area_ratio = 0.95
; A 70% fill can naturally approach the image border.
border_margin_px = 0
approach_lift_z_mm = 20.0
; Operator-verified black-table placement reference.
; Search remains camera-derived; detected table center supplies final X/Y.
; Measured final release pose:
; [125.8, 239.5, 177.8, -176.89, 3.71, -48.36]
fixed_place_enabled = true
fixed_place_flange_coords = 125.8, 239.5, 177.8, -176.89, 3.71, -48.36
final_joint_angles = 75.84, -64.42, 0.0, -20.91, 1.23, 34.36
final_use_joint_angles = true
fixed_place_speed = 10
fixed_place_final_speed = 8
fixed_place_approach_tol_mm = 8.0
; After release, continue the reverse HOME path when the vertical retreat
; reaches this close to the requested safe Z, even if residual X/Y error remains.
fixed_place_retreat_z_tolerance_mm = 3.0
; Retry once from HOME while keeping the object held.
fixed_place_approach_retry_count = 1
fixed_place_approach_retry_interval_sec = 0.5
search_move_to_start_enabled = false
search_start_joint_angles = 78.66, -71.19, 20.47, -36.21, -2.1, 33.66
search_start_speed = 15
final_flange_z_mm = 177.8
final_flange_orientation_deg = -176.89, 3.71, -48.36
; Keep Home Y/Z/orientation fixed and translate only along Base +X.
; Raise the camera to the configured safety maximum before searching.
search_z_mm = 350.0
search_x_range_mm = 100.0
search_x_step_mm = 20.0

; ============================================================================
; 6. UI
; ============================================================================

