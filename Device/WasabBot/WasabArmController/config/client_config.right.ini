# ============================================================================
# Raspberry Pi robot client -> Laptop-local YOLO + pick-plan service
# ============================================================================
# The Raspberry Pi captures the image and reads the current robot Flange pose.
# The laptop runs YOLO and 2D->3D pick planning, then returns flange_command.
#
# Before running:
#   1) Start the laptop server: python run_server.py
#   2) Find the laptop's LAN IPv4 address.
#   3) Confirm grasp_server_url below.
#
# Run on the Raspberry Pi:
#   cd /home/jetcobot/wasab/roscamp-repo-3/Device/WasabBot/WasabArmController
#   python3 check_server_connection.py
#   python3 run_client.py
# ============================================================================

# ============================================================================
# 1. Network / Remote Control / Camera Stream
# ============================================================================

[network]
; Use the laptop LAN IP, never 127.0.0.1. The laptop server listens on port 8000.
grasp_server_url = http://192.168.2.8:8000/v1/grasp-plan
; Health check is derived from grasp_server_url: http://192.168.2.8:8000/health.
; The paired laptop service returns this value from GET /health.
expected_server_runtime = laptop-local
; Keep false during deployment: loopback means "this Raspberry Pi", not the laptop.
allow_loopback_server = false
connect_timeout_sec = 3.0
health_timeout_sec = 5.0
check_server_on_startup = true
; CPU inference can be slower on the laptop. Increase only when an actual request needs longer.
request_timeout_sec = 45.0
jpeg_quality = 90

[arm_identity]
; Use left on the calibrated JetCobot. The second JetCobot must use right.
arm_id = right
role = right
dual_arm_enabled = true
configured = true
setup_mode = false

[camera_stream]
; Upload the latest robot camera frame to the laptop server so it can be viewed at:
;   http://192.168.2.8:8000/camera-view
; This does not run YOLO. It only sends a lightweight preview image.
enabled = true
fps = 4.0
timeout_sec = 0.8
jpeg_quality = 45

[udp_stream]
; WaSaBArm Streamer -> WaSaBWebService camera preview transport.
; Leave host empty to reuse the host from [network] grasp_server_url.
enabled = true
host =
port = 8001
; Keep below common MTU to reduce packet fragmentation on Wi-Fi.
max_datagram_bytes = 1400
; If UDP send fails locally, fall back to HTTP /camera-frame upload.
fallback_http = true

[remote_control]
; Browser button commands are delivered by a persistent server-push stream. No polling is used.
enabled = true
timeout_sec = 0.4

[hand_gesture]
; Hold an open palm steadily to run: pick box -> place at the configured AprilTag.
enabled = true
; Keep the feature available, but require the AdminGUI Gesture button to turn it on.
start_enabled = false
stable_frames = 24
release_frames = 6
cooldown_sec = 8.0
process_fps = 8.0
hold_sec = 3.0
min_palm_span_norm = 0.07
max_palm_span_norm = 0.30
edge_margin_norm = 0.06
; Reject palms above the calibrated v=220 line as too far away.
min_palm_v_px = 220
; Measured monocular handover reference:
; Most recently measured palm center (u=313, v=236) maps to this Place pose.
palm_reference_enabled = true
palm_reference_pixel_uv = 313, 236
palm_reference_flange_coords = 33.0, 238.9, 235.2, 176.68, -12.11, 142.72
palm_reference_joint_angles = 96.32, -43.85, -8.87, -26.45, 6.41, -135.43
; Fixed Place: do not correct Base XY from the recognized palm pixel.
palm_pixel_to_base_xy_mm = 0.0, 0.0, 0.0, 0.0
palm_max_xy_correction_mm = 60.0
; Home -> intermediate -> final Place, then reverse the same joint path.
palm_place_approach_joint_fraction = 0.75
; Palm Check mode: accumulate successful detections and render a heatbox image.
hitbox_calibration_enabled = true
hitbox_calibration_target_samples = 100
hitbox_calibration_output_dir = gesture_calibration
min_detection_confidence = 0.70
min_tracking_confidence = 0.70
auto_place = true
; Measured right-arm Gesture Mode observation pose. This is separate from HOME.
home_enabled = true
home_flange_coords = 49.4, 100.5, 373.6, 135.01, -42.36, 153.14
home_joint_angles = 100.63, 1.49, -9.22, -23.99, -2.98, -125.94
home_speed = 20

; ============================================================================
; 2. Camera / Robot / Gripper / Safety
; ============================================================================

[camera]
camera_id = /dev/v4l/by-id/usb-Sonix_Technology_Co.__Ltd._USB_2.0_Camera-video-index0
; Must exactly match the laptop server calibration settings.
; The supplied laptop project uses 640 x 480.
frame_width = 640
frame_height = 480
; Discard buffered frames when pick is requested so the plan uses a recent image.
flush_frames_before_capture = 2

[robot]
mycobot_port = /dev/ttyJETCOBOT
mycobot_baud = 1000000
; send_coords speed and mode
move_speed = 35
move_mode = 0
; Target-reached tolerances
pose_position_tol_mm = 3.0
pose_angle_tol_deg = 3.0
move_timeout_sec = 20.0
move_poll_sec = 0.05
; Measured right-arm HOME. Joint angles are preferred to preserve the verified IK branch.
; Base-frame home Flange pose: x, y, z, rx, ry, rz
home_flange_coords = -28.6, 175.1, 290.8, 173.62, -14.51, 165.41
home_joint_angles = 118.91, -20.03, -8.78, -46.49, 5.97, -134.91

[gripper]
; Typical electric gripper: 0=closed, 100=open. Adjust only for the physical device.
open_value = 100
close_value = 0
speed = 70
settle_sec = 0.4

[safety]
; Keep true for the first end-to-end laptop-local test.
; With true, no robot or gripper command is sent after a plan is received.
dry_run = false
; Pi-side final workspace gate for server flange_command [mm].
safe_x_min_mm = -260.0
safe_x_max_mm = 260.0
safe_y_min_mm = -281.0
safe_y_max_mm = 281.0
safe_z_min_mm = -50.0
safe_z_max_mm = 400.0
; Absolute limit for rx, ry, rz [deg].
safe_euler_abs_deg = 180.0

; ============================================================================
; 3. Manual Motion
; ============================================================================

[manual_motion]
; M command: move to this configured Base-frame Flange pose after local safety validation.
enabled = true
target_flange_coords = 195.1, 108.3, 178.8, -177.45, -6.11, 133.58

; ============================================================================
; 4. Pick Motion / Pick Search / Pick Centering
; ============================================================================

[pick_motion]
; Extra Base-frame XY correction applied only when the server auto-rotates the
; gripper for a long object. Tune signs after one test pick if the offset is
; opposite on the real gripper.
auto_rotated_xy_correction_enabled = false
auto_rotated_min_rz_offset_deg = 45.0
auto_rotated_base_xy_offset_mm = 0.0, 15.0
plan_base_xy_offset_mm = 0.0, 0.0
; Pick final motion: approach from above, then descend slowly to avoid hitting
; a tilted box from the side.
two_stage_approach_enabled = true
approach_lift_z_mm = 30.0
approach_speed = 15
final_approach_speed = 8
; 1 = Cartesian linear descent for the final short approach.
final_approach_mode = 1

[right_pick_reference]
; Operator-measured final Right Arm pickup pose.
enabled = true
flange_coords = -97.6, 259.7, 155.1, -175.48, -8.63, 158.19
joint_angles = 122.51, -67.14, -8.78, -9.66, 8.7, -125.68
; Use the complete operator-measured pickup pose after Coca-Cola detection.
use_reference_xyz = true
use_reference_z = true
use_reference_orientation = true
use_joint_target = true
; Joint-space staging avoids an unreachable Cartesian IK branch above the pick.
approach_joint_fraction = 0.75
joint_speed = 10

[pick_search]
; Pick command fallback: if the first camera view cannot detect the target,
; keep the vertical-down home orientation and move 20 mm to either side.
enabled = false
; Move to the measured Right Arm camera view, then scan only J5 slowly.
move_to_start_enabled = false
start_flange_coords = 215.2, -54.1, 218.8, 133.14, -38.05, 148.96
use_flange_pose = false
; Search starts from this vertical-down home Flange pose.
max_flange_coords = 215.2, -54.1, 218.8, 133.14, -38.05, 148.96
; Base Y is the left/right direction for the current home/camera setup.
translation_axis =
translation_offsets_mm = -20, 20
; If both side views miss, return to home X/Y and raise the camera by 20 mm.
lift_offsets_mm = 20
; Legacy rotation/joint settings below are ignored while translation_axis is set.
angle_axis = rz
angle_offsets_deg = 0, -25, 25, -45, 45
; Legacy single-axis search values. Used only when grid_enabled = false.
joints = 5
offsets_deg = 0, -3, 3, -6, 6, -9, 9, -12, 12
; 3x3 search moves one view cell at a time with enough settle time for YOLO.
grid_enabled = false
grid_joints = 1, 5
grid_offsets_deg = -10, 0, 10
speed = 5
settle_sec = 0.80
frame_timeout_sec = 1.4
; If every alternate view fails, return to the starting joint pose.
return_to_start = true

[pick_centering]
; If pick is rejected because the object bbox touches the image edge, move the
; camera view toward the bbox center and retry before the wider pick_search.
enabled = true
max_attempts = 3
deadband_px = 50.0
; If centering moves the object farther from center, flip the sign of the gain.
j1_gain_deg_per_px = -0.04
j2_gain_deg_per_px = 0.025
j5_gain_deg_per_px = 0.04
max_step_deg = 5.0
speed = 10
settle_sec = 0.25

; ============================================================================
; 5. Place Motion / Place Marker View / Marker Search
; ============================================================================

[place_motion]
; F command: move HOME first, then move to this Base-frame Flange pose and open the gripper.
; Placeholder is currently HOME_FLANGE_COORDS. Adjust this later for the real drop-off position.
enabled = true
target_flange_coords = 195.1, 108.3, 178.8, -177.45, -6.11, 133.58
; AprilTag place final approach speed. Lower values place the object more gently.
approach_speed = 12
; If enabled, place final approach is split into waypoints and slows down
; toward the final drop pose. Number of speeds controls the number of steps.
approach_slowdown_enabled = true
approach_speeds = 10, 4
; Pause after reaching the place pose before opening the gripper.
release_pause_sec = 0.3
; Gripper release used only by place. Manual q/open still uses [gripper] speed.
gripper_open_speed = 15
gripper_settle_sec = 1.0

[place_marker_view]
; Place command: after HOME and before marker search, rotate flange RZ while
; holding the object so the gripper is less likely to block the AprilTag view.
; This extra rotation is used only when the last pick used auto gripper rotation.
rotate_before_search_enabled = true
rz_offset_deg = 25.0
speed = 15

[marker_search]
; Internal Place flow: scan the camera until the required April marker is visible.
enabled = true
; AprilTag 36h11 role assignment. IDs 2 and 5 are intentionally ignored.
dictionary = DICT_APRILTAG_36h11
target_ids = 0, 1, 3, 4, 6, 7, 8, 9
pickup_ids = 0, 1, 3, 4, 6
place_ids = 7, 8, 9
; Passive recognition for the AdminGUI live preview; this never moves the robot.
; Avoid the same continuous OpenCV ArUco crash seen on Left Arm.
preview_detection_enabled = false
preview_detection_fps = 4.0
pan_joint = 1
pan_range_deg = 50.0
search_step_deg = 3.0
speed = 25
hz = 8.0
; 0 means keep scanning until a marker is found or the process is stopped.
max_duration_sec = 0.0
; While sweeping the pan joint, cycle these inner wrist joints through offset
; sets so the camera searches from wider marker-view angles.
view_joint_enabled = true
view_joints = 4, 5
; Semicolon-separated offset sets. Each row maps to view_joints in order.
view_joint_offsets_deg = 0, 0; 20, 20; -20, -20; 35, 15; -35, -15
view_joint_speed = 15

[marker_pickup]
; ID 6 fixed/dynamic tray pickup is handled only by the Left Arm.
enabled = false

; ============================================================================
; 6. UI
; ============================================================================

[black_table]
enabled = true
surface_z_base_mm = 0.0
max_value = 70
min_area_ratio = 0.08
max_area_ratio = 0.70
border_margin_px = 8
approach_lift_z_mm = 30.0
fixed_place_enabled = true
fixed_place_flange_coords = -35.0, 207.2, 232.7, -173.95, 2.45, 121.26
fixed_place_speed = 15
search_move_to_start_enabled = false
search_start_joint_angles = 116.1, -29.26, -24.08, -39.63, 5.8, -95.18
search_start_speed = 15
final_flange_z_mm = 232.7
final_flange_orientation_deg = -173.95, 2.45, 121.26
search_x_range_mm = 100.0
search_x_step_mm = 20.0

[ui]
show_window = false
window_name = Laptop-local pick/place client | pick | place | pose | gripper | servo-release | servo-focus | move | home | exit
