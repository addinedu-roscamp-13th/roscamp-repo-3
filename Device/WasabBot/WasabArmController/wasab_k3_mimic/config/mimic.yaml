# 얼굴 최우선: 선생님 얼굴은 face-recog/perception_node 가 /face 로 발행.
# arm_search 는 /face 만으로 SEARCH(sweep) / TRACK(얼굴 servo 추종) 한다.
# 손목/제스처(주먹·손가락)는 추후 /gesture 확장. arm_bridge 미사용(레거시).

arm_bridge:
  ros__parameters:
    coords_topic: /wasab/k3/target_coords
    port: /dev/ttyJETCOBOT
    baud: 1000000
    speed: 30

arm_search:
  ros__parameters:
    face_topic: /wasab/k3/face
    face_timeout: 2.0     # 간헐 미검출 흡수(잠깐 놓쳐도 TRACK 유지)
    face_conf_threshold: 0.3     # 선생님 얼굴 유사도 하한
    track_rate_hz: 10.0
    search_dwell_sec: 1.0     # step-and-stare: 이동완료 후 정지 ≥2 perception 프레임 확보(was 0.4)
    kx: -8.0          # yaw 비례게인 (부호 반전: 얼굴 추종 방향 보정)
    ky: 6.0           # pitch 비례게인 (상하 반대면 -6 으로)
    yaw_limit: 90.0   # J1 절대각 범위
    pitch_limit: 50.0 # J4 절대각 범위
    yaw_joint: 0
    pitch_joint: 3
    search_yaw_step: 14.0     # 연속 스텝 FOV 겹침(스텝 사이 얼굴 누락 방지, was 22)
    search_pitch_step: 6.0    # 상하도 약간 겹침(was 8)
    home: [0.0, 0.0, 0.0, -15.0, 0.0, -45.0]  # J4=-15: 카메라 수평 보정
    track_speed: 25           # TRACK servo 속도(조금씩 부드럽게)
    search_speed: 30          # 모션 블러↓·슬루 제어성↑(검출 가능 속도, was 55)
    port: /dev/ttyJETCOBOT
    baud: 1000000
