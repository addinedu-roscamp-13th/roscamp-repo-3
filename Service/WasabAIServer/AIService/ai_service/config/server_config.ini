; ============================================================================
; 노트북 로컬 YOLO + 로봇팔 파지계획 설정
; ============================================================================
; 이 폴더 전체(models/, calibration/ 포함)를 노트북으로 복사한 뒤 사용합니다.
; 라즈베리파이는 SSH 터널 없이 노트북의 LAN IP와 아래 port로 접속합니다.
;
; 실행: 프로젝트 루트에서
;   python run_server.py
; ============================================================================

; ============================================================================
; 1. Server / Model
; ============================================================================

[server]
; 0.0.0.0: 노트북의 유선/LAN IP로 들어오는 라즈베리파이 요청을 수신합니다.
; 노트북 자체에서만 시험할 때는 127.0.0.1로 바꿀 수 있습니다.
host = 192.168.2.8
port = 8000

[model]
; 가중치는 프로젝트와 함께 배포합니다. 절대경로를 쓰지 마십시오.
model_path = models/best_wasab_v3.pt
; 기본값은 호환성이 높은 CPU입니다.
; NVIDIA GPU를 노트북에서 사용할 경우 cuda:0으로 변경합니다.
device = cuda:0
; /detect 및 /grasp-plan 기본 confidence threshold.
; search 중 놓치면 0.5 또는 0.3으로 낮춰 테스트합니다.
default_conf = 0.5
; YOLO 입력 해상도
default_imgsz = 640

[logging]
; true면 각 요청의 raw.jpg, annotated.jpg, result.json을 저장합니다.
save_results = false
; 로그 저장 경로 (프로젝트 기준 상대 경로 가능)
save_root_dir = laptop_detect_logs

; ============================================================================
; 2. Calibration / Common Geometry
; ============================================================================

[calibration]
; 카메라 intrinsic/왜곡 계수 파일 (프로젝트 기준 상대 경로 가능)
intrinsic_file = calibration/auto_camera_intrinsic_charuco_20260723_180042.npz
; Eye-in-Hand hand-eye 결과 JSON (프로젝트 기준 상대 경로 가능)
handeye_result_json = calibration/auto_handeye_result_20260723_180042.json
; 기존 MyCobot 좌표계와 동일해야 합니다. 현재 구현은 zyx만 지원합니다.
euler_order = zyx
; 물체가 놓인 테이블 표면의 Base Z [mm]
object_plane_z_base_mm = 0.0
; 표면보다 위쪽을 파지 목표로 삼을 경우의 기본 추가 높이 [mm].
; 아래 [target_z_offsets_mm]에 없는 클래스는 이 값을 사용합니다.
default_target_z_offset_mm = 30.000
; Flange 좌표계에서 TCP까지 offset [mm]: x, y, z
; AdminGUI /camera-view 의 TCP offset 패널에서도 실시간 조정 가능합니다.
tcp_offset_flange_to_tcp_mm = 0.000, 10.000, 110.000
; Pick 최종 자세 보정 [deg]: rx, ry, rz.
; 기준 직각 파지 pose: 140.9, 121.7, 115.6, -177.4, 2.74, -92.69
; XYZ는 매번 검출 위치로 계산하고, 마지막 세 orientation 값만 고정합니다.
; Operator-verified reachable Coca-Cola pickup orientation.
; Reference flange pose: [55.4, 275.1, 127.2, -178.06, -3.65, -54.66]
pick_flange_orientation_deg = -178.06, -3.65, -54.66
; Place는 pick target별 Z offset을 참조한 뒤 이 값을 추가로 더합니다.
; 예: box pick offset 30mm이면 place 목표 Z offset은 40mm가 됩니다.
place_extra_z_offset_mm = 10.000
; AprilTag place 목표 TCP를 marker 중심에서 Base X축 방향으로 30mm 앞에 둡니다.
marker_place_tcp_offset_base_mm = 30.0, 0.0, 0.0

[right_calibration]
intrinsic_file = calibration/auto_camera_intrinsic_charuco_20260724_143751.npz
handeye_result_json = calibration/auto_handeye_result_20260724_143751.json

[handover_zone]
x_min_norm = 0.044125
x_max_norm = 0.980219
y_min_norm = 0.003963
y_max_norm = 0.997220

; ============================================================================
; 3. Pick Target Height / Per-Label Pick Offset
; ============================================================================

[target_z_offsets_mm]
box = 30.000
coca-cola = 27.000
globe = 70.000
kitkat = 12.000
snickers = 12.000
[pick_target_base_offsets_mm]
; Pick 목표 TCP를 label별로 Base 좌표계에서 추가 보정합니다 [x, y, z mm].
; 같은 쪽 박스 끝에 계속 걸리면 box의 X/Y를 5~10mm 단위로 조정합니다.
; 예: box = 0.0, -10.0, 0.0
box = 0.0, 0.0, 0.0
; No class-specific Cartesian bias. Camera/hand-eye calibration determines the target.
Coca-Cola = 0.0, 0.0, 0.0

[grip_target]
; For long rectangular objects, aim near one end instead of the center so the
; wrist/camera does not cover the middle of the object during pick approach.
long_object_end_grip_enabled = false
long_object_end_grip_aspect_ratio = 1.35
; 0.0=center, 0.48=near bbox edge. Start conservative to avoid missing the object.
long_object_end_grip_offset_fraction = 0.35
; lower/upper/left/right/positive/negative along the detected long axis.
long_object_end_grip_side = lower

[gripper_orientation]
; 물체 crop의 긴 축 각도를 추정해 그리퍼가 긴 방향을 그대로 물지 않도록 RZ를 자동 보정합니다.
; 수평 물체는 약 +90도, 대각선 물체는 검출된 각도만큼 중간값으로 보정됩니다.
auto_rotate_long_bbox_enabled = true
; 이 비율보다 사각형에 가까우면 회전 보정을 적용하지 않습니다.
auto_rotate_aspect_ratio = 1.35
; 이전 고정 보정값입니다. 현재 동적 각도 계산에서는 응답 호환용으로만 유지됩니다.
auto_rotate_rz_offset_deg = -90.0

; ============================================================================
; 4. Stream / Request Validation / Plan Safety
; ============================================================================

[udp_stream]
; WaSaBArm Streamer -> WaSaBWebService camera preview transport.
; The HTTP /camera-frame endpoint remains available as fallback.
enabled = true
host = 0.0.0.0
port = 8001
; Keep below common MTU to reduce packet fragmentation on Wi-Fi.
max_datagram_bytes = 1400
frame_timeout_sec = 1.0

[request_validation]
; 최대 업로드 이미지 크기 [byte]
max_upload_bytes = 8388608
; 이 calibration 파일의 image_size는 640 x 480입니다.
; Pi 카메라도 반드시 이 해상도로 캡처해야 2D→3D 계산이 유지됩니다.
expected_image_width = 640
expected_image_height = 480

[pick_roi]
; 홈 포지션 카메라 영상(640x480)에서 실제 Pick을 허용할 중앙 작업 영역입니다.
; 검출 bbox의 중심이 이 사각형 밖이면 로봇팔 이동 계획에서 제외됩니다.
; 현재 홈 포지션(147.2, 52.7, 242.2)을 기준으로 가장자리 120/80px을
; 보수적으로 제외했습니다. 현장 확인 후 10~20px 단위로 넓혀 사용하십시오.
enabled = false
x_min_px = 120
x_max_px = 520
y_min_px = 80
y_max_px = 400

[plan_safety]
; 서버가 plan 응답에 reachable 여부를 표시하기 위한 Pi-side workspace mirror입니다.
; 실제 최종 차단은 Pi client [safety] 설정이 계속 수행합니다.
safe_x_min_mm = -260.0
safe_x_max_mm = 260.0
safe_y_min_mm = -281.0
safe_y_max_mm = 290.0
safe_z_min_mm = -50.0
safe_z_max_mm = 400.0
safe_euler_abs_deg = 360.0
